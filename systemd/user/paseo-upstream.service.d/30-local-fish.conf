[Service]
# Keep exported agent credentials in ~/.local.fish as the source of truth.
# Silence sourcing output so credentials cannot accidentally enter the journal.
ExecStart=
ExecStart=/home/yang/.local/bin/fish --no-config -c 'source /home/yang/.local.fish >/dev/null 2>&1; or begin; echo "Paseo: failed to source ~/.local.fish" >&2; exit 1; end; exec /home/yang/git/paseo-backend-v0.12.0/node_modules/.bin/paseo daemon run --home /home/yang/.paseo-lumeny'
